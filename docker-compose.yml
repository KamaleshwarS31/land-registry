version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: land-registry-postgres
    environment:
      POSTGRES_DB: land_registry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d land_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
