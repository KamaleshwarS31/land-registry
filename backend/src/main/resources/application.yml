server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: land-registry-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

---
# Dev profile: uses embedded H2 with PostgreSQL compatibility mode for instant zero-dependency execution
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:land_registry;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

---
# Postgres profile: connects to Supabase or local Docker PostgreSQL
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/land_registry}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

---
# Test profile: fast in-memory H2
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:land_registry_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

---
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  supabase:
    url: ${SUPABASE_URL:https://YOUR_PROJECT_REF.supabase.co}
    key: ${SUPABASE_KEY:YOUR_SUPABASE_SERVICE_ROLE_KEY}
    bucket: ${SUPABASE_BUCKET:land-evidence}
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL} # LOCAL or SUPABASE
    local-dir: ${LOCAL_STORAGE_DIR:./uploads}
  blockchain:
    rpc-url: ${CHAIN_RPC_URL:http://127.0.0.1:8545}
    chain-id: ${CHAIN_ID:31337}
    contract-address: ${CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
    registrar-private-key: ${REGISTRAR_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
